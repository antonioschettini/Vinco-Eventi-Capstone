spring.application.name=backend
# Import dell' env.properties
spring.config.import=optional:file:backend/env.properties,optional:file:env.properties
# Configurazione del Server
server.port=${PORT}
# Configurazione del Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate
spring.jpa.hibernate.ddl-auto=update
# Configurazione Cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.apikey=${CLOUDINARY_API_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}
# JWT secret
jwt.secret=${JWT_SECRET}

# Configurazione Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:vincoeventi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Configurazione Multipart Upload per Foto e Video
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# CORS — Origini consentite (separare con virgola per più origini)
# In produzione impostare: app.cors.allowed-origins=https://www.vincoeventi.it,https://vincoeventi.it
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# Admin seed password (letta da env.properties — NON aggiungere default in chiaro qui)
admin.password=${ADMIN_PASSWORD}