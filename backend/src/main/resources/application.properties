spring.application.name=backend
# Import dell' env.properties
spring.config.import=optional:file:backend/env.properties,optional:file:env.properties
# Configurazione del Server
server.port=${PORT}
# Configurazione del Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurazione HikariCP Connection Pool (Ottimizzata per Cloud DB Remoto)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Configurazione Cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.apikey=${CLOUDINARY_API_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}
# JWT secret
jwt.secret=${JWT_SECRET}

# Configurazione Mail (Brevo SMTP / Flexible Relay)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:vincoeventi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xsmtpsib-1330f4e0de2e8a9b6f9d1be84a1f87b8d38bf0d6a8cc1e010cb978a51718e1c7-kzBqTTeV7A32Czkj}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:*}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
mail.from=${MAIL_FROM:vincoeventi@gmail.com}

# Configurazione Multipart Upload per Foto e Video
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# CORS — Origini consentite (separare con virgola per più origini)
# In produzione impostare: app.cors.allowed-origins=https://www.vincoeventi.it,https://vincoeventi.it
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# Base URLs per comunicazioni ed email (override tramite variabile d'ambiente o env.properties)
app.backend-base-url=${APP_BACKEND_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Admin seed password (letta da env.properties — NON aggiungere default in chiaro qui)
admin.password=${ADMIN_PASSWORD}