spring.application.name=backend
# Import dell' env.properties
spring.config.import=optional:file:backend/env.properties,optional:file:env.properties
# Configurazione del Server
server.port=${PORT:8080}
# Configurazione del Database
spring.datasource.url=${DB_URL:${DATABASE_URL:${INTERNAL_DATABASE_URL:jdbc:postgresql://localhost:5432/vinco_eventi}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurazione HikariCP Connection Pool (Ottimizzata per Cloud DB Remoto)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Dialect esplicito per PostgreSQL (evita auto-detection warnings su Hibernate 6)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Thread pool @Async — dimensionato per free tier (max-pool-size HikariCP=5)
# Core thread: 2 (sempre disponibili per audit asincrono)
# Max thread: 3 (lascia 2 connessioni HikariCP libere per le request utente)
# Queue capacity: 100 (buffer richieste audit in eccesso — fire-and-forget)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=3
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=audit-async-

# Configurazione Cloudinary
cloudinary.name=${CLOUDINARY_NAME:oe1bztwb}
cloudinary.apikey=${CLOUDINARY_API_KEY:282269152156915}
cloudinary.secret=${CLOUDINARY_SECRET:6_XTfKIbzd_nloCv1rCR1fIG9UU}
# JWT secret
jwt.secret=${JWT_SECRET:supersecretkey12345678901234567890123456789012}

# Configurazione Mail (Brevo SMTP / Flexible Relay)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:*}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
mail.from=${MAIL_FROM:vincoeventi@gmail.com}

# Configurazione Brevo HTTPS API (Porta 443 - Imune ai blocchi SMTP cloud)
brevo.api-key=${BREVO_API_KEY:}

# Configurazione Multipart Upload per Foto e Video
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# CORS — Origini consentite (separare con virgola per più origini)
# In produzione impostare: app.cors.allowed-origins=https://www.vincoeventi.com,https://vincoeventi.com,https://vinco-eventi-capstone.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# Base URLs per comunicazioni ed email (override tramite variabile d'ambiente o env.properties)
app.backend-base-url=${APP_BACKEND_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Admin seed password
admin.password=${ADMIN_PASSWORD:admin}